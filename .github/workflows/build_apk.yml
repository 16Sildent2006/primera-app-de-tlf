name: Compilar APK Android (Fletes Oriente)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Compilar APK con Flet Build Action
        id: build
        uses: flet-dev/flet-build-action@main
        with:
          target: apk
          runner-python-version: "3.11"
          bundled-python-version: "3.11"
          build-number: ${{ github.run_number }}
          install-linux-dependencies: true

      - name: Buscar APK generado
        if: always()
        run: find . -name "*.apk" 2>/dev/null || echo "No se encontro APK todavia"

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Fletes_Oriente_Camion350
          path: ${{ steps.build.outputs.archive-output }}
          if-no-files-found: warn
