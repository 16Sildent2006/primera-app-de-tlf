name: Compilar APK Android (Fletes Oriente)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
        id: flutter

      - name: Aceptar licencias de Android SDK
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet y Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet[all] fpdf2 python-docx

      - name: Compilar APK
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          echo "Usando Flutter en: $FLUTTER_DIR"
          flet build apk \
            --flutter-dir "$FLUTTER_DIR" \
            --project "Fletes Oriente" \
            --description "Cotizador Camion 350 para Oriente" \
            --org "com.fletes.oriente" \
            --module-name main
        env:
          CI: "true"

      - name: Buscar APK generado
        run: |
          echo "=== Buscando archivos APK ==="
          find . -name "*.apk" 2>/dev/null

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Fletes_Oriente_Camion350
          path: |
            build/apk/*.apk
            dist/*.apk
            build/**/*.apk
          if-no-files-found: error
