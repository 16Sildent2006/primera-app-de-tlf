name: Compilar APK Android (Fletes Oriente)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Flet
        run: python -m pip install --upgrade pip && python -m pip install "flet[cli]==0.86.5" fpdf2 python-docx

      - name: Compilar APK
        run: flet build apk --yes --python-version 3.12 --build-number ${{ github.run_number }} --output build/apk

      - name: Buscar APK generado
        if: always()
        run: find . -name "*.apk" 2>/dev/null || echo "No se encontro APK todavia"

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Fletes_Oriente_Camion350
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Publicar APK en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/apk/*.apk --title "Fletes Oriente $GITHUB_REF_NAME" --generate-notes
