name: Compilar APK Android (Fletes Oriente)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Compilar APK con Flet Build Action
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.11"
          bundled-python-version: "3.11"
          build-number: ${{ github.run_number }}
          extra-build-args: >-
            --project "Fletes Oriente"
            --description "Cotizador Camion 350 para Oriente"
            --org "com.fletes.oriente"
            --module-name main

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Fletes_Oriente_Camion350
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
